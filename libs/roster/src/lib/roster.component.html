<h1>Conduit Roster</h1>

<div *ngIf="loading">Loading roster...</div>
<div *ngIf="error">{{ error }}</div>

<table *ngIf="!loading && !error">
  <thead>
    <tr>
      <th>User</th>
      <th>Articles Authored</th>
      <th>Total Favorites Received</th>
      <th>First Article Date</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of roster">
      <td>
        <a [routerLink]="['/profile', user.username]">
          <img [src]="user.profileImage" alt="{{ user.username }}" width="24" height="24" style="border-radius:50%;vertical-align:middle;margin-right:8px;">
          {{ user.username }}
        </a>
      </td>
      <td>{{ user.articleCount }}</td>
      <td>{{ user.totalFavorites }}</td>
      <td>{{ user.firstArticleDate ? (user.firstArticleDate | date:'mediumDate') : '' }}</td>
    </tr>
  </tbody>
</table>
